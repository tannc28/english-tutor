<title>Lớp tiếng Anh của Tân</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Literata:opsz,wght@7..72,400;7..72,500;7..72,600&display=swap">
<style>
/* Layout: study desk. Header + phase track on top; lesson shelf (left, horizontal strip on phones) and the open workbook (right).
   Lessons are steps in a sequence, so parts carry real step numbers. Type colors encode lesson kind. */
:root{
  --bg:#eef1f5; --surface:#ffffff; --sunk:#f5f7fa; --ink:#141a26; --ink-2:#4a5468; --ink-3:#7a8497; --line:#dde2ea;
  --accent:#2449d8; --accent-soft:#e7ecfd; --on-accent:#ffffff;
  --walk:#0d8577; --main:#2449d8; --weekly:#b06a12; --sunday:#c03a68;
  --marker:#fff0a6; --marker-ink:#3b3000;
  --ok:#17794a; --ok-soft:#e2f4ea; --warn:#9a5a00; --warn-soft:#fdf1dc; --bad:#b4261f; --bad-soft:#fce6e4;
  --paper:#fffdf7; --paper-line:#efe8d6;
  --shadow:0 1px 2px rgba(20,26,38,.05),0 6px 24px rgba(20,26,38,.06);
  --f-ui:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-read:"Literata",Georgia,"Times New Roman",serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d1016; --surface:#161b24; --sunk:#11151d; --ink:#e8ecf3; --ink-2:#aab3c5; --ink-3:#7d879a; --line:#262d3a;
  --accent:#8ea8ff; --accent-soft:#1c2540; --on-accent:#0d1220;
  --walk:#4fd1bf; --main:#8ea8ff; --weekly:#f0b45c; --sunday:#f58bb0;
  --marker:#4d4210; --marker-ink:#fff1b8;
  --ok:#7cd8a6; --ok-soft:#14291f; --warn:#f2c46e; --warn-soft:#2e2511; --bad:#ff9d94; --bad-soft:#331a19;
  --paper:#1b1f27; --paper-line:#2b303b; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 28px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1016; --surface:#161b24; --sunk:#11151d; --ink:#e8ecf3; --ink-2:#aab3c5; --ink-3:#7d879a; --line:#262d3a;
  --accent:#8ea8ff; --accent-soft:#1c2540; --on-accent:#0d1220;
  --walk:#4fd1bf; --main:#8ea8ff; --weekly:#f0b45c; --sunday:#f58bb0;
  --marker:#4d4210; --marker-ink:#fff1b8;
  --ok:#7cd8a6; --ok-soft:#14291f; --warn:#f2c46e; --warn-soft:#2e2511; --bad:#ff9d94; --bad-soft:#331a19;
  --paper:#1b1f27; --paper-line:#2b303b; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 28px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
.wrap{max-width:none;margin:0 auto;padding-block:20px 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mono{font-family:var(--f-mono)}
.label{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}

/* Header */
.top{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px 24px;align-items:end}
.brand h1{margin:2px 0 0;font-size:clamp(1.35rem,2.6vw,1.75rem);font-weight:700;letter-spacing:-.02em;text-wrap:balance}
.stats{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.stat{display:flex;flex-direction:column;gap:2px;min-width:84px;padding:8px 12px;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.stat b{font-size:1.15rem;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.2}
@media (max-width:640px){.top{grid-template-columns:minmax(0,1fr)}.stats{justify-content:flex-start}}

/* Phase track */
.track{margin-top:16px;padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:12px;display:grid;grid-template-columns:1fr;gap:8px}
.segs.cefr .seg{height:26px;display:grid;place-items:center;font-family:var(--f-mono);font-size:.72rem;color:var(--ink-3)}
.segs.cefr .seg.done{color:var(--on-accent)}
.segs.cefr .seg.now{color:var(--accent);font-weight:600}
[hidden]{display:none!important}
.ph{display:flex;flex-direction:column;gap:6px;min-width:0}
.ph .nm{font-size:.78rem;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ph .nm b{color:var(--ink);font-weight:600}
.segs{display:flex;gap:3px}
.seg{flex:1;height:8px;border-radius:3px;background:var(--sunk);border:1px solid var(--line)}
.seg.done{background:var(--accent);border-color:var(--accent)}
.seg.now{background:var(--accent-soft);border-color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent)}


/* Layout */
.layout{display:grid;grid-template-columns:280px minmax(0,1fr);gap:24px;margin-top:20px;align-items:start}
body.shelf-off .layout{grid-template-columns:minmax(0,1fr)}
body.shelf-off .shelf{display:none}
body.focus .top,body.focus .track,body.focus .tabs,body.focus .shelf{display:none}
body.focus .layout{grid-template-columns:minmax(0,1fr);margin-top:0}
/* Workbook toolbar + table of contents */
.toolbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
@media (max-width:640px){.tbtn .bl,#submit .bl{display:none}.toolbar .ttl{display:none}.toolbar{gap:6px 8px;padding:8px}div.toolbar>.grow{min-width:0}div.toolbar .grow .bar{min-width:36px!important}.tbtn{padding:7px 10px}.dock .info{display:none}}
#msg{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--tbh,64px) + 8px);z-index:6}
#msg:empty{display:none}
.dock-btns{display:flex;gap:10px;margin-left:auto}
.save-st{font-size:.78rem;color:var(--ink-3);white-space:nowrap;max-width:46ch;overflow:hidden;text-overflow:ellipsis}
.save-st[data-k="local"]{color:var(--warn)}
.save-st[data-k="ok"]{color:var(--ok)}
.toolbar .grow{flex:1;min-width:140px;display:flex;align-items:center;gap:10px}
.toolbar .ttl{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:38ch}
.tbtn{font:inherit;font-size:.86rem;font-weight:600;padding:7px 12px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;white-space:nowrap}
.tbtn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.bookgrid{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:20px;align-items:start}
.bookcol{min-width:0;display:flex;flex-direction:column;gap:16px}
.toc{position:sticky;top:calc(env(safe-area-inset-top,0px) + 72px);display:flex;flex-direction:column;gap:4px;padding:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;max-height:calc(100vh - 100px);overflow:auto}
.toc a{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:8px;align-items:center;padding:7px 8px;border-radius:8px;color:var(--ink-2);text-decoration:none;font-size:.86rem}
.toc a:hover{background:var(--sunk)}
.toc a.on{background:var(--accent-soft);color:var(--ink)}
.toc .n{width:24px;height:24px;border-radius:7px;display:grid;place-items:center;font-family:var(--f-mono);font-size:.74rem;background:var(--sunk);border:1px solid var(--line)}
.toc a.full .n{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.toc .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toc .c{font-family:var(--f-mono);font-size:.72rem;color:var(--ink-3)}
.part,.fb{scroll-margin-top:calc(var(--tbh,64px) + 16px)}
@media (max-width:1100px){
  .bookgrid{grid-template-columns:minmax(0,1fr)}
  .toc{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--tbh,64px) + 6px);z-index:5;flex-direction:row;overflow-x:auto;max-height:none;padding:6px;order:-1}
  .toc .lbl{display:none}
  .toc a{grid-template-columns:24px auto;flex:none}
  .toc a .t{display:none}
  .part,.fb{scroll-margin-top:calc(var(--tbh,64px) + 64px)}
}
@media (max-width:880px){.layout{grid-template-columns:minmax(0,1fr)}}

/* Shelf */
.shelf{position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px);display:flex;flex-direction:column;gap:10px;min-width:0}
.shelf-head{display:flex;justify-content:space-between;align-items:baseline}
#list{display:flex;flex-direction:column;gap:6px;max-height:calc(100vh - 140px);overflow:auto;padding:2px}
@media (max-width:880px){
  .shelf{position:static}
  #list{flex-direction:row;overflow-x:auto;max-height:none;padding-bottom:6px;scroll-snap-type:x proximity}
  #list .item{min-width:230px;scroll-snap-align:start}
}
.item{--tc:var(--main);position:relative;display:grid;gap:4px;text-align:left;width:100%;padding:12px 14px 12px 18px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:inherit;font:inherit;cursor:pointer}
.item::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:4px;border-radius:0 3px 3px 0;background:var(--tc)}
.item:hover{border-color:var(--ink-3)}
.item[aria-current="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.item .row{display:flex;justify-content:space-between;gap:8px;align-items:center}
.item .t{font-weight:600;line-height:1.35;font-size:.93rem}
.t-walk{--tc:var(--walk)}.t-main{--tc:var(--main)}.t-weekly{--tc:var(--weekly)}.t-sunday{--tc:var(--sunday)}
.kind{font-family:var(--f-mono);font-size:.68rem;letter-spacing:.06em;text-transform:uppercase;color:var(--tc)}
.pill{font-size:.7rem;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap;background:var(--sunk);color:var(--ink-2)}
.pill.open{background:var(--warn-soft);color:var(--warn)}
.pill.submitted{background:var(--accent-soft);color:var(--accent)}
.pill.graded{background:var(--ok-soft);color:var(--ok)}

/* Workbook */
.book{min-width:0;display:flex;flex-direction:column;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.hero{--tc:var(--main);padding:24px clamp(16px,3.5vw,32px);border-top:4px solid var(--tc);display:flex;flex-direction:column;gap:10px}
.hero h2{margin:0;font-size:clamp(1.3rem,2.8vw,1.7rem);line-height:1.25;letter-spacing:-.015em;text-wrap:balance}
.meta{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;color:var(--ink-2);font-size:.86rem}
.meta .dot{display:inline-flex;gap:6px;align-items:center}
.progress{display:flex;align-items:center;gap:10px;margin-top:4px}
.bar{flex:1;height:6px;border-radius:99px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .25s}
.intro{max-width:70ch;color:var(--ink-2)}

.part{padding:24px clamp(16px,3.5vw,32px);display:grid;grid-template-columns:40px minmax(0,1fr);gap:4px 16px}
.step{grid-row:1/span 3;width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-family:var(--f-mono);font-weight:500;background:var(--accent-soft);color:var(--accent)}
.part h3{margin:0;font-size:1.12rem;line-height:1.3}
.part .kind{color:var(--accent)}
@media (max-width:520px){.part{grid-template-columns:minmax(0,1fr)}.step{grid-row:auto;width:30px;height:30px;font-size:.85rem}}

.md{max-width:86ch;min-width:0}
.md p,.md li{margin:.55em 0}
.md ul,.md ol{padding-left:1.3em}
.md h4{margin:1.2em 0 .3em;font-size:.95rem}
.md blockquote{margin:14px 0;padding:18px 22px;background:var(--paper);border:1px solid var(--paper-line);border-radius:10px;font-family:var(--f-read);font-size:1.07rem;line-height:1.85;color:var(--ink)}
.md blockquote p{margin:.6em 0}
.md mark{background:var(--marker);color:var(--marker-ink);padding:0 3px;border-radius:3px}
.md a{color:var(--accent);font-weight:500;text-underline-offset:3px}
.md a[href^="http"]::after{content:" ↗";font-size:.85em}
.md code{font-family:var(--f-mono);font-size:.86em;background:var(--sunk);padding:1px 6px;border-radius:5px;border:1px solid var(--line)}
.md pre{overflow-x:auto;background:var(--sunk);padding:12px 14px;border-radius:8px;border:1px solid var(--line)}
.md pre code{border:0;padding:0;background:none}
.md .tbl{overflow-x:auto;margin:10px 0}
.md table{border-collapse:collapse;font-size:.92rem;min-width:100%}
.md th,.md td{border-bottom:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}
.md th{font-weight:600;color:var(--ink-2);font-size:.82rem}
.md hr{border:0;border-top:1px dashed var(--line);margin:18px 0}

.qs{display:flex;flex-direction:column;gap:12px;margin-top:16px}
.q{padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:var(--sunk);display:flex;flex-direction:column;gap:10px}
.q.done{border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.qt{display:flex;gap:10px;align-items:flex-start;font-weight:600}
.qn{flex:none;min-width:30px;height:24px;padding:0 6px;border-radius:7px;display:grid;place-items:center;font-family:var(--f-mono);font-size:.74rem;font-weight:500;background:var(--surface);border:1px solid var(--line);color:var(--ink-2)}
.q.done .qn{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.qt .qx{min-width:0}.qt .qx p{margin:0}
textarea,input[type=text],input[type=number]{width:100%;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:10px 12px}
textarea{min-height:84px;resize:vertical;line-height:1.55}
textarea.dict{font-family:var(--f-mono);font-size:.9rem}
textarea:focus,input:focus,button:focus-visible,.opt:focus-within{outline:2px solid var(--accent);outline-offset:1px}
textarea:disabled,input:disabled{opacity:.8}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:var(--surface);cursor:pointer}
.opt input{margin-top:4px;accent-color:var(--accent)}
.opt-other span{color:var(--ink-2)}
.other-note{margin-top:2px}
.linkbtn{justify-self:start;font:inherit;font-size:.82rem;color:var(--ink-3);background:none;border:0;padding:2px 0;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.linkbtn:hover{color:var(--ink)}
.opt:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}

.fb{padding:22px clamp(16px,3.5vw,32px);display:flex;flex-direction:column;gap:16px;border:1px dashed var(--accent);background:var(--surface);border-radius:14px}
.fb h3{margin:0;font-size:1.05rem}
.scale{display:flex;gap:8px;flex-wrap:wrap}
.scale label{position:relative}
.scale input{position:absolute;opacity:0;pointer-events:none}
.scale span{display:grid;place-items:center;width:46px;height:46px;border:1px solid var(--line);border-radius:10px;font-family:var(--f-mono);cursor:pointer;background:var(--sunk)}
.scale input:checked+span{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.scale input:focus-visible+span{outline:2px solid var(--accent);outline-offset:1px}
.scale-cap{display:flex;justify-content:space-between;max-width:262px;font-size:.75rem;color:var(--ink-3)}
.fl{display:flex;flex-direction:column;gap:6px}
.fl>span{font-weight:600}

/* Submit dock */
.dock{position:sticky;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);z-index:5;display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;justify-content:space-between;padding:12px 14px 12px 18px;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.dock .info{font-size:.88rem;color:var(--ink-2)}
button.primary{font:inherit;font-weight:600;padding:11px 22px;border-radius:10px;border:0;background:var(--accent);color:var(--on-accent);cursor:pointer}
button.primary.sm{padding:7px 16px;font-size:.88rem}
button.primary:disabled{opacity:.5;cursor:not-allowed}
button.ghost{font:inherit;font-weight:500;padding:9px 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.banner{padding:12px 16px;border-radius:10px;font-size:.92rem}
.banner.ok{background:var(--ok-soft);color:var(--ok)}
.banner.warn{background:var(--warn-soft);color:var(--warn)}
.banner.bad{background:var(--bad-soft);color:var(--bad)}

/* Grade */
.grade{padding:22px clamp(16px,3.5vw,32px);display:flex;flex-direction:column;gap:14px;border-top:4px solid var(--ok)}
.score{display:flex;flex-wrap:wrap;gap:8px}
.score span{font-family:var(--f-mono);font-size:.9rem;padding:6px 12px;border-radius:9px;background:var(--ok-soft);color:var(--ok);font-variant-numeric:tabular-nums}
.grade details{border:1px solid var(--line);border-radius:10px;padding:12px 16px;background:var(--sunk)}
.grade summary{cursor:pointer;font-weight:600}

.player{margin-top:14px;padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:var(--sunk);display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.pl-row{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center}
.pl-rate{font-size:.86rem;color:var(--ink-2);display:flex;gap:6px;align-items:center}
.pl-sel{font:inherit;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.transcript{width:100%;padding:14px 18px;background:var(--paper);border:1px solid var(--paper-line);border-radius:10px;font-family:var(--f-read);line-height:1.8}
.transcript p{margin:.4em 0}
/* Tabs */
.tabs{display:flex;gap:6px;margin-top:16px;padding:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;width:max-content;max-width:100%;overflow-x:auto}
.tab{padding:8px 14px;border-radius:9px;color:var(--ink-2);text-decoration:none;font-weight:600;font-size:.9rem;white-space:nowrap}
.tab[aria-current="page"]{background:var(--accent);color:var(--on-accent)}
.view{margin-top:20px;display:flex;flex-direction:column;gap:16px}
.sec{padding:22px clamp(16px,3.5vw,32px);display:flex;flex-direction:column;gap:12px}
.sec h2{margin:0;font-size:1.15rem}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tile{padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:var(--sunk);display:flex;flex-direction:column;gap:4px}
.tile b{font-size:1.5rem;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.tile .sub{font-size:.8rem;color:var(--ink-3)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.list{margin:0;padding-left:1.2em}.list li{margin:.35em 0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:4px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-size:.82rem;font-weight:500}
.tblwrap{overflow-x:auto}
table.days{border-collapse:collapse;width:100%;font-size:.9rem}
table.days th,table.days td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.days th{font-size:.75rem;font-family:var(--f-mono);letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3);font-weight:500}
table.days td.num{font-variant-numeric:tabular-nums;font-family:var(--f-mono);white-space:nowrap}
table.days tr[data-id]{cursor:pointer}
table.days tr[data-id]:hover td{background:var(--sunk)}
/* Chart (2 series: Đọc = blue, Nghe = orange; validated light+dark) */
:root{--s-read:#2449d8;--s-listen:#d9480f}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--s-read:#6a84ee;--s-listen:#de6a28}}
:root[data-theme="dark"]{--s-read:#6a84ee;--s-listen:#de6a28}
.chart{position:relative;width:100%}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .axis{fill:var(--ink-3);font-family:var(--f-mono);font-size:11px}
.chart .ln{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart .dot{stroke:var(--surface);stroke-width:2}
.chart .dlab{font-size:12px;font-weight:600;fill:var(--ink)}
.chart .xh{stroke:var(--ink-3);stroke-width:1;stroke-dasharray:3 3}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:.86rem;color:var(--ink-2)}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:6px}
.tip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px;padding:8px 10px;font-size:.82rem;min-width:140px;transform:translate(-50%,-110%);white-space:nowrap}
.tip b{display:block;margin-bottom:2px}
.sw{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.recs{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.rec-card{padding:14px 16px;border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:10px;background:var(--sunk)}
.rec-card p{margin:.4em 0 0}
.weak{display:flex;flex-direction:column;gap:12px}
.weak-item{display:flex;gap:10px;align-items:flex-start}
.weak-item p{margin:.3em 0 0}
.pace{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
table.days tr.next td{background:var(--accent-soft)}
.rec{display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.rec .md{width:100%}
.rec-pick{display:inline-flex;align-items:center;gap:6px;font-weight:600;padding:10px 16px;border-radius:10px;border:1px solid var(--accent);color:var(--accent);background:var(--surface);cursor:pointer}
.rec-au{width:100%;max-width:420px}
.empty{padding:36px clamp(16px,3.5vw,36px)}
.empty h2{margin:6px 0 8px;font-size:1.3rem}
.empty p{color:var(--ink-2);max-width:62ch}
.sched{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-top:16px}
.sched div{--tc:var(--main);padding:10px 12px;border:1px solid var(--line);border-left:4px solid var(--tc);border-radius:10px;background:var(--sunk);font-size:.86rem}
.sched b{display:block;font-family:var(--f-mono);font-weight:500}
.note{font-size:.88rem;color:var(--ink-3)}
@media (prefers-reduced-motion:no-preference){.item,.opt,button{transition:border-color .15s,background .15s,box-shadow .15s}}

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<script>
(() => {
  const TRIGGER_ID = "trig_01AN7RrytvZ5BmXiymy5Ym5M";
  const TYPE_LABEL = {day:"Bài trong ngày", walk:"Walk Pack", main:"Bài chính", weekly:"Nhìn lại tuần", sunday:"Chủ nhật", test:"Bài thử"};
  const STATUS_LABEL = {open:"Chưa làm", submitted:"Đã nộp", graded:"Đã chấm"};
  const $ = s => document.querySelector(s);
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const md = s => {
    if (!s) return "";
    try {
      let html = window.marked ? marked.parse(String(s)) : "<p>" + esc(s).replace(/\n/g,"<br>") + "</p>";
      html = html.replace(/<table/g,'<div class="tbl"><table').replace(/<\/table>/g,"</table></div>");
      html = html.replace(/<a href="http/g,'<a target="_blank" rel="noopener" href="http');
      return window.DOMPurify ? DOMPurify.sanitize(html, {ADD_ATTR:["target"]}) : esc(s);
    } catch { return esc(s); }
  };
  const inline = s => md(s).replace(/^\s*<p>|<\/p>\s*$/g,"");
  const store = {
    get(k){ try { return JSON.parse(localStorage.getItem(k) || "null"); } catch { return null; } },
    set(k,v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
  };

  // NGUỒN DỮ LIỆU DUY NHẤT = repo GitHub (thư mục data/), xuất bản kèm trang:
  //   data/days.json (danh sách ngày + chỉ số), data/profile.json, data/lessons/<id>.json, data/grades/<id>.json
  // Database của artifact CHỈ nhận bài nộp (submissions/<id>, inbox/<id>).
  let db = null, lessons = [], subs = {}, grades = {}, bodies = {}, current = null, unsubCur = [], week = 1;
  const getJSON = async p => { const r = await fetch(p, {cache:"no-store"}); if (!r.ok) throw {code:"http_"+r.status}; return r.json(); };

  const LEVELS = ["A2","B1","B1+","B2","B2+","C1"];
  function renderTrack(){
    const cur = String(profile?.cefr?.overall || "").trim(), ci = LEVELS.indexOf(cur);
    $("#cefr").innerHTML = LEVELS.map((lv,i) => `<span class="seg ${ci>=0 && i<ci?"done":i===ci?"now":""}">${lv}</span>`).join("");
    if (cur) $("#cefr-now").textContent = `mức hiện tại (ước lượng): ${cur}`;
  }

  async function loadBody(id){
    if (bodies[id]) return;
    bodies[id] = {loading:true};
    try { bodies[id] = await getJSON("data/lessons/"+encodeURIComponent(id)+".json"); }
    catch(e){ bodies[id] = {parts:[], intro_md:"Không tải được nội dung bài ("+(e?.code||"lỗi")+"). Tải lại trang thử nhé."}; }
    if (current === id) renderLesson();
  }
  function watchCurrent(){
    unsubCur.forEach(u => { try { u(); } catch {} }); unsubCur = [];
    if (!current) return;
    const id = current, meta = lessons.find(l => l.id === id);
    if (meta?.status === "graded" && !grades[id]) getJSON("data/grades/"+encodeURIComponent(id)+".json").then(g => { grades[id] = g; if (current===id) renderLesson(); }).catch(()=>{});
    if (db) db.doc("drafts/"+id).get().then(snap => {
      const c = snap.data(); if (!c || current !== id || subs[id]) return;
      const loc = store.get("draft:"+id);
      if (!loc || (c.savedAt||"") > (loc.savedAt||"")){
        store.set("draft:"+id, c);
        if (c.log && c.log.v === 1){ act = c.log; act.sessions.push({s:nowS(), e:nowS()}); }
        if (!document.activeElement?.closest?.(".book")) renderLesson();
        setSave("ok", c.savedAt, "Đã lấy bản lưu trên mây");
      } else setSave("ok", loc.savedAt);
    }).catch(() => {});
    if (db) unsubCur.push(db.doc("submissions/"+id).onSnapshot(s => { const d = s.data(); if (d) subs[id] = d; else delete subs[id]; if (current===id && !$("#main").dataset.editing) renderLesson(); }));
  }

  function fmtDate(d){
    if (!d) return "";
    const [y,m,dd] = d.split("-");
    const wd = ["Chủ nhật","Thứ 2","Thứ 3","Thứ 4","Thứ 5","Thứ 6","Thứ 7"][new Date(d+"T12:00:00").getDay()];
    return `${wd}, ${dd}/${m}`;
  }
  function statusOf(l){ return (l.status==="graded" || grades[l.id]) ? "graded" : (subs[l.id] ? "submitted" : (l.status || "open")); }

  function renderList(){
    const el = $("#list");
    $("#count").textContent = lessons.length ? `${lessons.length} bài` : "";
    $("#s-done").textContent = lessons.filter(l => statusOf(l)==="graded").length;
    if (!lessons.length){ el.innerHTML = '<p class="note">Chưa có bài nào.</p>'; return; }
    el.innerHTML = lessons.map(l => {
      const st = statusOf(l);
      return `<button class="item t-${esc(l.type)}" data-id="${esc(l.id)}" aria-current="${current===l.id}">
        <span class="row"><span class="kind">${l.dayNo?`Ngày ${esc(l.dayNo)}`:esc(TYPE_LABEL[l.type]||l.type||"Bài")}</span><span class="pill ${st}">${STATUS_LABEL[st]}</span></span>
        <span class="t">${esc(l.title || "Bài học")}</span>
        <span class="note">${esc(fmtDate(l.date))}${l.minutes?` · ~${esc(l.minutes)} phút`:""}</span>
      </button>`;
    }).join("");
    el.querySelectorAll(".item").forEach(b => b.addEventListener("click", () => { location.hash = b.dataset.id; }));
  }

  function qInput(q, val, locked){
    const id = "q-" + q.id, dis = locked ? "disabled" : "";
    if (q.type === "choice" && Array.isArray(q.options)){
      const isOther = typeof val === "string" && val.startsWith("Khác: ");
      const note = isOther ? val.slice(6) : "";
      return `<div class="opts" role="radiogroup">${q.options.map((o,i)=>`<label class="opt"><input type="radio" name="${id}" id="${id}-${i}" value="${esc(o)}" ${val===o?"checked":""} ${dis}><span>${esc(o)}</span></label>`).join("")}
        <label class="opt opt-other"><input type="radio" name="${id}" id="${id}-other" value="__other" ${isOther?"checked":""} ${dis}><span>✏️ Khác / không chắc…</span></label>
        <input type="text" class="other-note" id="${id}-note" placeholder="Ghi rõ: phân vân giữa đáp án nào, chưa hiểu chỗ nào…" value="${esc(note)}" ${isOther?"":"hidden"} ${dis}>
        ${dis ? "" : `<button type="button" class="linkbtn opt-clear" data-q="${esc(q.id)}">Bỏ chọn</button>`}
      </div>`;
    }
    if (q.type === "recording"){
      let info = null; try { info = val ? JSON.parse(val) : null; } catch {}
      return `<div class="rec" data-qid="${esc(q.id)}">
        ${q.read ? `<div class="md"><blockquote>${md(q.read)}</blockquote></div>` : ""}
        <input type="hidden" id="${id}" value="${esc(val||"")}">
        ${locked ? "" : `<label class="ghost rec-pick">🎙️ ${info?"Thu lại / chọn file khác":"Thu âm hoặc chọn file ghi âm"}<input type="file" accept="audio/*,video/mp4,video/webm,.m4a,.mp3,.wav,.aac,.ogg,.3gp,.amr" capture hidden></label>`}
        <span class="note rec-st">${info ? `✅ Đã tải lên: ${esc(info.name||"bản thu")} (${Math.round((info.size||0)/1024)} KB)` : "Chưa có bản thu"}</span>
        <audio class="rec-au" controls hidden></audio>
      </div>`;
    }
    if (q.type === "short") return `<input type="text" id="${id}" value="${esc(val||"")}" placeholder="${esc(q.placeholder||"Trả lời ngắn")}" ${dis}>`;
    const cls = q.type === "dictation" ? "dict" : "";
    return `<textarea id="${id}" class="${cls}" placeholder="${esc(q.placeholder||(q.type==="dictation"?"Gõ lại đúng những gì nghe được…":"Câu trả lời của Tân…"))}" ${dis}>${esc(val||"")}</textarea>`;
  }

  function allQs(l){ const out = []; (l.parts||[]).forEach(p => (p.questions||[]).forEach(q => out.push(q))); return out; }
  function collect(l){
    const answers = {};
    allQs(l).forEach(q => {
      if (q.type === "choice"){
        const c = document.querySelector(`input[name="q-${CSS.escape(q.id)}"]:checked`);
        if (!c) answers[q.id] = "";
        else if (c.value === "__other"){ const n = (document.getElementById(`q-${q.id}-note`)?.value || "").trim(); answers[q.id] = "Khác: " + (n || "(không chắc)"); }
        else answers[q.id] = c.value;
      }
      else { const e = document.getElementById("q-"+q.id); answers[q.id] = e ? e.value : ""; }
    });
    const diff = document.querySelector('input[name="fb-diff"]:checked');
    const feedback = {difficulty: diff ? Number(diff.value) : null, hardest: $("#fb-hard")?.value || "", minutes: $("#fb-min")?.value || "", extra: $("#fb-extra")?.value || ""};
    return {answers, feedback};
  }
  function updateProgress(l){
    const qs = allQs(l); if (!qs.length) return;
    const answers = collect(l).answers; let n = 0;
    qs.forEach(q => { const done = !!(answers[q.id]||"").trim(); if (done) n++; document.getElementById("qb-"+q.id)?.classList.toggle("done", done); });
    const w = Math.round(n/qs.length*100) + "%";
    ["#pbar","#pbar2"].forEach(sel => { const b = $(sel); if (b) b.style.width = w; });
    if ($("#plab")) $("#plab").textContent = `${n}/${qs.length} câu`;
    if ($("#plab2")) $("#plab2").textContent = `${n}/${qs.length}`;
    (l.parts||[]).forEach((p,pi) => {
      const pq = p.questions||[], el = $("#tocc-"+pi), a = $("#toc-"+pi);
      if (!el || !pq.length) return;
      const k = pq.filter(q => (answers[q.id]||"").trim()).length;
      el.textContent = `${k}/${pq.length}`; a.classList.toggle("full", k === pq.length);
    });
  }
  // ---- Mục lục, thu gọn danh sách, chế độ tập trung
  const prefs = store.get("prefs") || {};
  if (prefs.shelfOff) document.body.classList.add("shelf-off");
  if (prefs.focus) document.body.classList.add("focus");
  function setPref(k, on, cls){ prefs[k] = on; store.set("prefs", prefs); document.body.classList.toggle(cls, on); }
  let tocObs = null;
  function bindToc(){
    const tb = document.querySelector(".toolbar"); if (tb) document.documentElement.style.setProperty("--tbh", tb.offsetHeight + "px");
    $("#tg-shelf")?.addEventListener("click", e => { const off = !document.body.classList.contains("shelf-off"); setPref("shelfOff", off, "shelf-off"); if (!off) setPref("focus", false, "focus"); syncToggles(); });
    $("#tg-focus")?.addEventListener("click", () => { setPref("focus", !document.body.classList.contains("focus"), "focus"); syncToggles(); });
    document.querySelectorAll(".toc a[data-go]").forEach(a => a.addEventListener("click", ev => { ev.preventDefault(); document.getElementById(a.dataset.go)?.scrollIntoView({behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block:"start"}); }));
    tocObs?.disconnect();
    if ("IntersectionObserver" in window){
      tocObs = new IntersectionObserver(es => { es.forEach(en => { if (en.isIntersecting){ const id = en.target.id.replace("part-",""); document.querySelectorAll(".toc a").forEach(x => x.classList.toggle("on", x.id === "toc-"+id)); } }); }, {rootMargin:"-90px 0px -60% 0px"});
      document.querySelectorAll(".part,.fb").forEach(sec => tocObs.observe(sec));
    }
  }
  $("#shelf-hide")?.addEventListener("click", () => { setPref("shelfOff", true, "shelf-off"); syncToggles(); });
  function syncToggles(){
    $("#tg-shelf")?.setAttribute("aria-pressed", String(!document.body.classList.contains("shelf-off") && !document.body.classList.contains("focus")));
    $("#tg-focus")?.setAttribute("aria-pressed", String(document.body.classList.contains("focus")));
  }

  function emptyView(){
    return `<div class="card empty">
      <div class="label">Sổ bài</div>
      <h2>${lessons.length ? "Chọn một bài để bắt đầu" : "Chưa có bài nào"}</h2>
      <p>Mỗi sáng gia sư đăng đủ bài của ngày, điều chỉnh theo kết quả và feedback hôm trước. Tân làm lúc nào tiện, xong bấm <b>Nộp bài</b>; khoảng một phút sau điểm và nhận xét hiện ngay tại đây.</p>
      <div class="sched">
        <div style="--tc:var(--main)"><b>06:00 mỗi ngày</b>Gia sư đăng đủ bài của ngày</div>
        <div style="--tc:var(--walk)"><b>Lúc nào tiện</b>Tân làm, bấm Nộp bài</div>
        <div style="--tc:var(--weekly)"><b>~1 phút sau</b>Điểm + nhận xét hiện ở đây</div>
      </div>
    </div>`;
  }

  // ---- Lưu tiến trình: luôn lưu trên máy (tức thì) + tự động lưu lên mây (DB, 2 giây sau khi ngừng gõ) + nút Lưu.
  let saveState = {k:"idle", at:null, msg:""}, cloudTimer = null, pendingL = null;
  const hhmm = t => t ? new Date(t).toLocaleTimeString("vi-VN", {hour:"2-digit", minute:"2-digit", second:"2-digit"}) : "";
  // Trạng thái lưu chỉ là 1 biểu tượng nhỏ; chi tiết nằm ở tooltip (title).
  function saveLabel(){ return {saving:"⏳", ok:"☁️", local:"⚠️", dirty:"✏️"}[saveState.k] || "☁️"; }
  function saveTitle(){
    const s = saveState;
    if (s.k === "saving") return "Đang lưu lên mây…";
    if (s.k === "ok") return `Đã lưu lên mây lúc ${hhmm(s.at)}`;
    if (s.k === "local") return `Đã lưu trên máy lúc ${hhmm(s.at)}, chưa lên mây (${s.msg||"mất mạng?"}). Trang sẽ tự thử lại.`;
    if (s.k === "dirty") return "Có thay đổi, sắp tự lưu";
    return "Tự động lưu đang bật";
  }
  function setSave(k, at, msg){ saveState = {k, at:at||saveState.at, msg:msg||""}; const el = $("#save-st"); if (el){ el.textContent = saveLabel(); el.dataset.k = k; el.title = saveTitle(); el.setAttribute("aria-label", saveTitle()); } }
  // ---- Nhật ký quá trình làm bài (cho gia sư phân tích hành vi). Chỉ số tổng hợp, không ghi từng phím.
  //   sessions: các phiên làm bài [{s,e}] (giây kể từ lúc mở bài lần đầu) → biết nghỉ giữa chừng
  //   parts[pi].ms: thời gian thực sự làm/đọc ở mỗi phần (chỉ đếm khi đang tương tác & trang đang mở)
  //   q[qid]: first (giây lần đầu chạm), ms (thời gian chú ý), edits (số lần sửa), changes (đổi đáp án trắc nghiệm: from→to, t)
  //   listen[pi]: plays, rates, revealAt (giây hiện lời), answeredBeforeReveal (số câu của phần đã trả lời trước khi xem lời)
  let act = null, actLastInput = 0, actCurQ = null, actTick = null, actDirty = false, actLesson = null;
  const nowS = () => act ? Math.round((Date.now() - act.t0)/1000) : 0;
  function initActivity(l, saved){
    actLesson = l;
    act = (saved && saved.v === 1) ? saved : {v:1, t0:Date.now(), sessions:[], parts:{}, q:{}, listen:{}};
    act.sessions.push({s:nowS(), e:nowS()});
    clearInterval(actTick);
    actTick = setInterval(() => {
      if (!act || document.hidden) return;
      const active = Date.now() - actLastInput < 45000;
      const ss = act.sessions[act.sessions.length-1]; if (ss) ss.e = nowS();
      if (!active) return;
      const on = document.querySelector(".toc a.on")?.id?.replace("toc-","");
      if (on != null){ const k = on; act.parts[k] = act.parts[k] || {ms:0}; act.parts[k].ms += 5000; }
      if (actCurQ){ const r = act.q[actCurQ] = act.q[actCurQ] || {first:nowS(), ms:0, edits:0}; r.ms += 5000; }
      actDirty = true;
      if (actLesson && !subs[actLesson.id]) saveLocal(actLesson);
    }, 5000);
  }
  function actPoke(){ actLastInput = Date.now(); }
  function actInput(ev){
    if (!act) return; actPoke();
    const box = ev.target?.closest?.(".q"); if (!box) return;
    const qid = box.id.replace(/^qb-/,""); actCurQ = qid;
    const r = act.q[qid] = act.q[qid] || {first:nowS(), ms:0, edits:0};
    if (ev.target.type === "radio" && ev.type !== "change") return;
    if (ev.target.type !== "radio" && ev.type === "change") return;
    r.edits++;
    if (ev.target.type === "radio" && ev.type === "change"){
      r.changes = r.changes || [];
      if (r.last != null && r.last !== ev.target.value) r.changes.push({t:nowS(), from:r.last, to:ev.target.value});
      r.last = ev.target.value; if (r.changes.length > 12) r.changes.shift();
    }
    actDirty = true;
  }
  function actListen(pi, kind, rate){
    if (!act) return; actPoke();
    const r = act.listen[pi] = act.listen[pi] || {plays:0, rates:[]};
    if (kind === "play"){ r.plays++; r.rates.push(rate); if (r.rates.length > 10) r.rates.shift(); }
    if (kind === "reveal" && r.revealAt == null){
      r.revealAt = nowS();
      const p = actLesson?.parts?.[pi], a = actLesson ? collect(actLesson).answers : {};
      r.answeredBeforeReveal = (p?.questions||[]).filter(q => (a[q.id]||"").trim()).length + "/" + (p?.questions||[]).length;
    }
    actDirty = true;
  }
  document.addEventListener("visibilitychange", () => {
    if (!act) return;
    if (document.hidden){ const ss = act.sessions[act.sessions.length-1]; if (ss) ss.e = nowS(); if (actLesson) saveLocal(actLesson); }
    else act.sessions.push({s:nowS(), e:nowS()});
  });
  document.addEventListener("focusin", ev => { const box = ev.target?.closest?.(".q"); if (box && act){ actCurQ = box.id.replace(/^qb-/,""); actPoke(); const r = act.q[actCurQ] = act.q[actCurQ] || {first:nowS(), ms:0, edits:0}; } });
  document.addEventListener("scroll", actPoke, {passive:true});
  document.addEventListener("pointerdown", actPoke, {passive:true});
  setInterval(() => { if (actDirty && actLesson && !subs[actLesson.id]){ actDirty = false; saveLocal(actLesson); if (saveState.k !== "saving") cloudSave(actLesson); } }, 60000);

  function saveLocal(l){ const d = {...collect(l), log:act, savedAt:new Date().toISOString()}; store.set("draft:"+l.id, d); return d; }
  function scheduleCloud(l){ pendingL = l; setSave("dirty"); clearTimeout(cloudTimer); cloudTimer = setTimeout(() => cloudSave(l), 2000); }
  async function cloudSave(l, manual){
    clearTimeout(cloudTimer);
    const d = store.get("draft:"+l.id) || saveLocal(l);
    if (!db){ setSave("local", d.savedAt, "chưa kết nối"); return; }
    setSave("saving");
    try { await db.doc("drafts/"+l.id).set(d); pendingL = null; setSave("ok", d.savedAt, manual ? "Đã lưu" : ""); }
    catch(e){ pendingL = l; setSave("local", d.savedAt, e?.code || (navigator.onLine === false ? "mất mạng" : "lỗi")); }
  }
  window.addEventListener("online", () => { if (pendingL) cloudSave(pendingL); });
  setInterval(() => { if (pendingL && saveState.k === "local") cloudSave(pendingL); }, 30000);
  window.addEventListener("pagehide", () => { if (pendingL) cloudSave(pendingL); });

  function renderLesson(){
    const main = $("#main");
    const meta = lessons.find(x => x.id === current);
    if (meta && !meta.parts && (!bodies[meta.id] || bodies[meta.id].loading)){
      main.innerHTML = `<div class="card hero t-${esc(meta.type)}"><span class="kind">${esc(TYPE_LABEL[meta.type]||"Bài học")}</span><h2>${esc(meta.title||"Bài học")}</h2><p class="note">Đang mở bài…</p></div>`;
      loadBody(meta.id); return;
    }
    const l = meta ? {...meta, ...(meta.parts ? {} : bodies[meta.id])} : null;
    if (!l){ main.innerHTML = emptyView(); return; }

    const sub = subs[l.id], grade = grades[l.id];
    const locked = !!grade || (!!sub && !main.dataset.editing);
    const draft = store.get("draft:"+l.id) || {};
    const ans = sub && !main.dataset.editing ? (sub.answers||{}) : {...(sub?.answers||{}), ...(draft.answers||{})};
    const fb = sub && !main.dataset.editing ? (sub.feedback||{}) : {...(sub?.feedback||{}), ...(draft.feedback||{})};
    const st = statusOf(l), nQ = allQs(l).length;
    let qn = 0;
    const scores = String(grade?.score||"").split(/\s*·\s*/).filter(Boolean);

    const tocItems = (l.parts||[]).map((p,pi)=>`<a href="#" data-go="part-${pi}" id="toc-${pi}"><span class="n">${pi+1}</span><span class="t">${esc(p.kind||p.title||"Phần "+(pi+1))}</span><span class="c" id="tocc-${pi}"></span></a>`).join("") + `<a href="#" data-go="part-fb" id="toc-fb"><span class="n">✓</span><span class="t">Feedback & Nộp</span><span class="c"></span></a>`;
    main.innerHTML = `
      <div class="toolbar">
        <button class="tbtn" id="tg-shelf" type="button" aria-pressed="${!document.body.classList.contains("shelf-off")}" title="Hiện/ẩn danh sách bài">☰<span class="bl"> Danh sách</span></button>
        <button class="tbtn" id="tg-focus" type="button" aria-pressed="${document.body.classList.contains("focus")}" title="Ẩn mọi thứ trừ bài làm">🎯<span class="bl"> Tập trung</span></button>
        <div class="grow"><span class="ttl">${esc(l.title||"")}</span>${nQ && !grade ? `<div class="bar" style="flex:1;min-width:80px"><i id="pbar2" style="width:0%"></i></div><span class="note mono" id="plab2">0/${nQ}</span>` : ""}</div>
        ${grade ? `<span class="save-st" data-k="ok">✅ Đã chấm · xem kết quả đầu bài</span>`
          : locked ? `<span class="save-st">Đã nộp ${esc(new Date(sub.submittedAt).toLocaleString("vi-VN"))} · đang chấm</span><button class="tbtn" id="edit" type="button">Sửa & nộp lại</button>`
          : `<span class="save-st" id="save-st" role="status" title="${esc(saveTitle())}" aria-label="${esc(saveTitle())}">${esc(saveLabel())}</span><button class="tbtn" id="save-now" type="button" title="Lưu ngay lên mây">💾<span class="bl"> Lưu</span></button><button class="primary sm" id="submit" type="button" title="Nộp bài">📤<span class="bl"> Nộp bài</span></button>`}
      </div>
      <div id="msg"></div>
      <div class="bookgrid">
      <div class="bookcol">
      <section class="card hero t-${esc(l.type)}">
        <span class="kind">${esc(TYPE_LABEL[l.type]||"Bài học")} · ${esc(fmtDate(l.date))}</span>
        <h2>${esc(l.title||"Bài học")}</h2>
        <div class="meta">
          ${l.minutes?`<span class="dot">⏱ ~${esc(l.minutes)} phút</span>`:""}
          <span class="dot">${(l.parts||[]).length} phần · ${nQ} câu</span>
          <span class="pill ${st}">${STATUS_LABEL[st]}</span>
        </div>
        ${nQ && !grade ? `<div class="progress"><div class="bar"><i id="pbar" style="width:0%"></i></div><span class="note mono" id="plab">0/${nQ} câu</span></div>` : ""}
        ${l.intro_md ? `<div class="md intro">${md(l.intro_md)}</div>` : ""}
      </section>
      ${grade ? `<section class="card grade" aria-label="Kết quả chấm">
          <span class="label">Kết quả · gia sư đã chấm</span>
          ${scores.length?`<div class="score">${scores.map(s=>`<span>${esc(s)}</span>`).join("")}</div>`:""}
          <div class="md">${md(grade.summary_md)}</div>
          ${grade.answers_md?`<details><summary>Đáp án & sửa lỗi</summary><div class="md">${md(grade.answers_md)}</div></details>`:""}
          ${grade.next_md?`<div class="md">${md(grade.next_md)}</div>`:""}
        </section>` : ""}
      ${(l.parts||[]).map((p,pi) => `
        <section class="card part" id="part-${pi}">
          <span class="step" aria-hidden="true">${pi+1}</span>
          ${p.kind?`<span class="kind">${esc(p.kind)}</span>`:""}
          <h3>${esc(p.title||"")}</h3>
          <div>
            <div class="md">${md(p.md)}</div>
            ${Array.isArray(p.listen) && p.listen.length ? playerHtml(l.id, pi, p) : ""}
            ${(p.questions||[]).length ? `<div class="qs">${p.questions.map(q => `
              <div class="q" id="qb-${esc(q.id)}">
                <label class="qt" for="q-${esc(q.id)}"><span class="qn">✍️ ${++qn}</span><span class="qx">${inline(q.q)}</span></label>
                ${qInput(q, ans[q.id], locked)}
              </div>`).join("")}</div>` : ""}
          </div>
        </section>`).join("")}
      <section class="fb" id="part-fb" aria-labelledby="fb-h">
        <h3 id="fb-h">📝 Feedback cuối bài</h3>
        <div class="fl"><span>Độ khó của bài</span>
          <div class="scale" role="radiogroup" aria-label="Độ khó">${[1,2,3,4,5].map(n=>`<label><input type="radio" name="fb-diff" id="fb-diff-${n}" value="${n}" ${fb.difficulty==n?"checked":""} ${locked?"disabled":""}><span>${n}</span></label>`).join("")}</div>
          <div class="scale-cap"><span>quá dễ</span><span>quá khó</span></div></div>
        <label class="fl" for="fb-hard"><span>Chỗ khó hiểu nhất</span><textarea id="fb-hard" placeholder="Câu nào, đoạn nào, từ nào làm Tân bí?" ${locked?"disabled":""}>${esc(fb.hardest||"")}</textarea></label>
        <label class="fl" for="fb-min"><span>Thời gian làm bài này (phút)</span><input type="number" id="fb-min" min="0" inputmode="numeric" value="${esc(fb.minutes||"")}" ${locked?"disabled":""} style="max-width:140px"></label>
        <label class="fl" for="fb-extra"><span>Ngoài bài, hôm nay Tân nghe/đọc tiếng Anh thêm bao nhiêu phút? <span class="note">(phim, podcast, YouTube, truyện… – không bắt buộc)</span></span><input type="number" id="fb-extra" min="0" inputmode="numeric" value="${esc(fb.extra||"")}" ${locked?"disabled":""} style="max-width:140px"></label>
      </section>
      </div>
      <nav class="toc" aria-label="Mục lục bài"><span class="label lbl">Mục lục</span>${tocItems}</nav>
      </div>`;

    if (!locked){
      main.oninput = main.onchange = ev => { actInput(ev); saveLocal(l); updateProgress(l); scheduleCloud(l); };
      $("#save-now")?.addEventListener("click", () => { saveLocal(l); cloudSave(l, true); });
      $("#submit").addEventListener("click", () => submit(l));
    } else { main.oninput = main.onchange = null; }
    updateProgress(l);
    bindToc();
    main.querySelectorAll(".opts").forEach(g => {
      g.addEventListener("change", ev => { if (ev.target.type !== "radio") return; const note = g.querySelector(".other-note"); if (note){ note.hidden = ev.target.value !== "__other"; if (!note.hidden) note.focus(); } });
      g.querySelector(".opt-clear")?.addEventListener("click", () => { g.querySelectorAll("input[type=radio]").forEach(r => r.checked = false); const note = g.querySelector(".other-note"); if (note){ note.value = ""; note.hidden = true; } g.dispatchEvent(new Event("input", {bubbles:true})); });
    });
    if (!locked && actLesson?.id !== l.id) initActivity(l, (store.get("draft:"+l.id)||{}).log);
    bindPlayers(l);
    bindRecorders(l);
    $("#edit")?.addEventListener("click", () => { main.dataset.editing = "1"; renderLesson(); });
  }

  // ---- Listening player: Claude đọc bài nghe (tts). Lời ẩn cho tới khi Tân bấm hiện.
  let ttsP = null, playingKey = null;
  const reveal = {}, plays = store.get("plays") || {};
  const getTts = () => (ttsP ||= (window.claude?.use ? claude.use("tts") : Promise.resolve(null)).catch(() => null));
  function playerHtml(id, pi, p){
    const key = id+"#"+pi, open = !!reveal[key], n = plays[key]||0;
    const lines = p.listen.map(x => `<p>${x.who?`<b>${esc(x.who)}:</b> `:""}${esc(x.text)}</p>`).join("");
    return `<div class="player" data-key="${esc(key)}" data-pi="${pi}">
      <div class="pl-row">
        <button class="primary pl-play" type="button">▶ Nghe</button>
        <button class="ghost pl-stop" type="button" hidden>■ Dừng</button>
        <label class="pl-rate">Tốc độ <select class="pl-sel">${[0.8,0.9,1,1.1].map(r=>`<option value="${r}" ${r==(p.rate||0.9)?"selected":""}>${r}×</option>`).join("")}</select></label>
        <span class="note pl-n">Đã nghe ${n} lần</span>
      </div>
      <div class="note pl-msg" hidden></div>
      <button class="ghost pl-tx" type="button">${open?"Ẩn lời":"Hiện lời (transcript)"}</button>
      <div class="md transcript" ${open?"":"hidden"}>${lines}</div>
    </div>`;
  }
  function bindPlayers(l){
    document.querySelectorAll(".player").forEach(box => {
      const key = box.dataset.key, p = (l.parts||[])[Number(box.dataset.pi)];
      const play = box.querySelector(".pl-play"), stop = box.querySelector(".pl-stop"), msg = box.querySelector(".pl-msg");
      box.querySelector(".pl-tx").addEventListener("click", e => { if (!reveal[key]) actListen(box.dataset.pi, "reveal"); reveal[key] = !reveal[key]; box.querySelector(".transcript").hidden = !reveal[key]; e.target.textContent = reveal[key]?"Ẩn lời":"Hiện lời (transcript)"; });
      play.addEventListener("click", () => {
        const rate = Number(box.querySelector(".pl-sel").value)||0.9;
        actListen(box.dataset.pi, "play", rate);
        const lines = p.listen.map((x,i) => ({text:String(x.text).slice(0,2000), voice:x.voice||"buttery", rate, language:"en", id:"l"+i}));
        getTts().then(t => {
          if (!t){ msg.hidden = false; msg.textContent = "Thiết bị này chưa đọc thành tiếng được (thử Chrome hoặc app Claude trên máy tính). Tạm thời Tân đọc phần lời nhé."; return; }
          playingKey = key; play.hidden = true; stop.hidden = false; msg.hidden = true;
          t.speak(lines, {rate, language:"en"}).then(() => {
            plays[key] = (plays[key]||0)+1; store.set("plays", plays);
            box.querySelector(".pl-n").textContent = `Đã nghe ${plays[key]} lần`;
          }).catch(e => { if (e?.code && e.code!=="stopped"){ msg.hidden = false; msg.textContent = e.code==="rate_limited" ? "Đã nghe nhiều quá trong giờ này, đợi một lúc rồi nghe tiếp nhé." : "Chưa phát được ("+e.code+")."; } })
           .finally(() => { if (playingKey===key){ playingKey=null; } play.hidden = false; stop.hidden = true; });
        });
      });
      stop.addEventListener("click", () => getTts().then(t => t?.stop().catch(()=>{})));
    });
  }

  // ---- Thu âm: điện thoại ghi âm/chọn file → mã hoá base64 → lưu vào kho file của trang (text/plain nhận mọi định dạng).
  function bindRecorders(l){
    document.querySelectorAll(".rec").forEach(box => {
      const inp = box.querySelector('input[type=file]'); if (!inp) return;
      const st = box.querySelector(".rec-st"), au = box.querySelector(".rec-au"), hid = box.querySelector('input[type=hidden]');
      inp.addEventListener("change", async () => {
        const f = inp.files && inp.files[0]; if (!f) return;
        if (f.size > 14*1024*1024){ st.textContent = "File quá lớn (tối đa ~14 MB). Thu ngắn lại khoảng 1–2 phút nhé."; return; }
        try { au.src = URL.createObjectURL(f); au.hidden = false; } catch {}
        st.textContent = "Đang tải bản thu lên…";
        try {
          const assets = await claude.use("assets");
          if (!assets){ st.textContent = "Trang chưa có quyền lưu file trên thiết bị này. Mở trang trên claude.ai khi đã đăng nhập."; return; }
          const b64 = await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(",")[1]||""); r.onerror = rej; r.readAsDataURL(f); });
          const up = await assets.upload(new Blob([b64], {type:"text/plain"}), {type:"text/plain"});
          hid.value = JSON.stringify({asset:up.id, enc:"base64", mime:f.type||"", name:f.name||"recording", size:f.size, at:new Date().toISOString()});
          st.textContent = `✅ Đã tải lên: ${f.name||"bản thu"} (${Math.round(f.size/1024)} KB). Nhớ bấm Nộp bài khi xong.`;
          saveLocal(l); updateProgress(l); cloudSave(l);
        } catch(e){
          st.textContent = {too_large:"File quá lớn, thu ngắn lại nhé.", not_granted:"Cần bấm Cho phép để trang lưu file.", unavailable:"Thiết bị này chưa lưu file được."}[e?.code] || `Chưa tải lên được (${e?.code||"lỗi"}). Thử lại nhé.`;
        }
      });
    });
  }

  function summaryText(l, data){
    const lines = [`Bài: ${l.id} – ${l.title||""}`];
    let n = 0;
    allQs(l).forEach(q => { lines.push(`${++n}. [${q.id}] ${q.q}\n→ ${data.answers[q.id]||"(bỏ trống)"}`); });
    lines.push(`FEEDBACK: độ khó ${data.feedback.difficulty}/5 · khó nhất: ${data.feedback.hardest||"-"} · thời gian: ${data.feedback.minutes||"-"} phút`);
    return lines.join("\n").slice(0, 60000);
  }

  async function submit(l){
    const msg = $("#msg"), btn = $("#submit");
    const data = collect(l);
    if (!data.feedback.difficulty){ msg.innerHTML = '<div class="banner warn">Chọn độ khó (1–5) ở phần Feedback rồi nộp nhé.</div>'; $("#fb-h")?.scrollIntoView({behavior:"smooth",block:"center"}); return; }
    if (!db){ msg.innerHTML = '<div class="banner bad">Chưa kết nối được nơi lưu bài. Mở trang trên claude.ai khi đã đăng nhập rồi thử lại.</div>'; return; }
    btn.disabled = true; btn.innerHTML = "⏳<span class=\"bl\"> Đang nộp…</span>";
    if (act){ const ss = act.sessions[act.sessions.length-1]; if (ss) ss.e = nowS(); }
    const rec = {lessonId:l.id, ...data, log:act, submittedAt:new Date().toISOString()};
    const diag = {at:new Date().toISOString()};
    const savePromise = db.doc("submissions/"+l.id).set(rec);
    // Báo gia sư ngay trong cú bấm (Send to Claude cần thao tác gần đây của người xem)
    let sentPromise = (async () => {
      const c = await claude.use("comments");
      diag.comments = !!c;
      if (!c) return false;
      const st = await c.canSendToClaude(); diag.canSend = st;
      if (st !== "available") return false;
      const anchor = await c.anchorFor(document.querySelector(".hero"));
      const r = await c.sendToClaude({anchor, text:`📥 Nộp bài ${l.id} – gia sư chấm giúp mình (bài làm trong submissions/${l.id})`});
      diag.thread = r?.threadId || ""; return true;
    })().catch(e => { diag.cCode = e?.code||""; diag.cMsg = String(e?.message||e||"").slice(0,300); return false; });
    sentPromise = Promise.race([sentPromise, new Promise(r => setTimeout(() => { diag.cTimeout = true; r(false); }, 8000))]);
    try {
      await savePromise;
    } catch(e){
      btn.disabled = false; btn.innerHTML = "📤<span class=\"bl\"> Nộp bài</span>";
      msg.innerHTML = `<div class="banner bad">Chưa lưu được bài (${esc(e?.code||"lỗi")}). Bài nháp vẫn còn trên máy, bấm Nộp bài lần nữa.</div>`;
      return;
    }
    subs[l.id] = rec; delete $("#main").dataset.editing;
    try { db.doc("drafts/"+l.id).delete(); } catch {}
    try { db.doc("inbox/"+l.id).set({lessonId:l.id, submittedAt:rec.submittedAt}); } catch {}
    renderList(); renderLesson();
    const m2 = $("#msg");
    m2.innerHTML = '<div class="banner ok">Đã nộp. Đang báo gia sư…</div>';
    const text = summaryText(l, data);
    let notified = await sentPromise, reason = "";
    diag.via = notified ? "comments" : "";
    if (!notified) try {
      const mcp = await claude.use("mcp");
      diag.mcp = !!mcp;
      if (mcp){
        diag.via = "fire_trigger";
        const r = await mcp.callTool("Claude Code Remote", "fire_trigger", {trigger_id:TRIGGER_ID, text});
        diag.result = JSON.stringify(r?.payload ?? r ?? null).slice(0,300); notified = true;
      }
      else reason = "trang chưa có quyền gọi gia sư";
    } catch(e){
      diag.code = e?.code||""; diag.message = String(e?.message||e||"").slice(0,800);
      reason = {not_in_manifest:"Tân chưa cho phép trang gọi Claude Code Remote", approval_required:"cần Tân bấm Cho phép", server_not_connected:"chưa kết nối Claude Code Remote", blocked_by_policy:"tổ chức chặn công cụ này"}[e?.code] || (e?.code||"lỗi không rõ");
    }
    diag.ok = notified;
    try { await db.doc("submissions/"+l.id).update({notify:diag}); } catch {}
    if (notified) m2.innerHTML = '<div class="banner ok">Đã nộp và đã báo gia sư. Kết quả sẽ hiện ở đầu bài khi chấm xong (thường khoảng 1 phút).</div>';
    else {
      m2.innerHTML = `<div class="banner warn">Bài đã lưu, nhưng chưa tự báo được gia sư (${esc(reason)}). Nhắn <b>"nộp bài ${esc(l.id)}"</b> trong phiên chat là gia sư sẽ chấm.</div>`;
    }
  }

  // ---- Hồ sơ & Tiến độ (meta/profile + stats/<lessonId>: vài trăm byte mỗi ngày)
  let profile = null, stats = [];
  const pct = v => (v==null || v==="") ? "–" : `${Math.round(Number(v))}%`;
  const li = a => (a&&a.length) ? `<ul class="list">${a.map(x=>`<li>${inline(String(x))}</li>`).join("")}</ul>` : `<p class="note">Chưa có dữ liệu.</p>`;
  function renderProfile(){
    const v = $("#view-profile"), p = profile || {};
    const c = p.cefr || {};
    const lv = (k, label) => `<div class="tile"><span class="label">${label}</span><b>${esc(c[k]||"–")}</b>${p.levels?.[k]?`<span class="sub">${esc(p.levels[k])}</span>`:""}</div>`;
    v.innerHTML = `
      <section class="card sec">
        <span class="label">Hồ sơ học sinh${p.updatedAt?` · cập nhật ${esc(new Date(p.updatedAt).toLocaleDateString("vi-VN"))}`:""}</span>
        <h2>Tân · mục tiêu tiếng Anh phổ thông C1</h2>
        ${!profile ? `<p class="note">Hồ sơ sẽ có sau khi gia sư chấm bài đánh giá đầu vào (Ngày 1).</p>` : ""}
        <div class="tiles">${lv("overall","Tổng thể (ước lượng)")}${lv("listening","Nghe")}${lv("reading","Đọc")}${lv("vocab","Từ vựng")}${lv("grammar","Ngữ pháp & từ nối")}</div>
      </section>
      ${p.teacher_md ? `<section class="card sec"><span class="label">Giáo viên nhận xét</span><div class="md">${md(p.teacher_md)}</div></section>` : ""}
      <div class="cols">
        <section class="card sec"><span class="label">Điểm mạnh</span>${li(p.strengths)}</section>
        <section class="card sec"><span class="label">Cần cải thiện</span>${li(p.weaknesses)}</section>
      </div>
      <div class="cols">
        <section class="card sec"><span class="label">Sở thích (để chọn input)</span>${p.interests?.length?`<div class="chips">${p.interests.map(x=>`<span class="chip">${esc(x)}</span>`).join("")}</div>`:`<p class="note">Chưa có dữ liệu.</p>`}${p.habits?`<p class="note">${esc(p.habits)}</p>`:""}</section>
        <section class="card sec"><span class="label">Đang tập trung</span>${p.focus_md?`<div class="md">${md(p.focus_md)}</div>`:`<p class="note">Chưa có dữ liệu.</p>`}</section>
      </div>
      ${(p.decisions||[]).length ? `<section class="card sec"><span class="label">Vì sao bài lại như vậy (nhật ký quyết định)</span>
        <div class="tblwrap"><table class="days"><thead><tr><th>Ngày</th><th>Quyết định</th></tr></thead><tbody>
        ${p.decisions.slice().reverse().map(d=>`<tr><td class="num">${esc(d.date||"")}</td><td>${inline(d.text||"")}</td></tr>`).join("")}
        </tbody></table></div></section>` : ""}`;
  }
  function chartSvg(rows){
    const W = 720, H = 240, L = 40, R = 70, T = 14, B = 30, iw = W-L-R, ih = H-T-B;
    const n = rows.length, x = i => L + (n<=1 ? iw/2 : i*iw/(n-1)), y = v => T + ih - (v/100)*ih;
    const ser = [{k:"readPct", name:"Đọc", c:"var(--s-read)"},{k:"listenPct", name:"Nghe", c:"var(--s-listen)"}];
    let g = [0,25,50,75,100].map(v=>`<line class="grid" x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/><text class="axis" x="${L-8}" y="${y(v)+4}" text-anchor="end">${v}%</text>`).join("");
    const step = Math.max(1, Math.ceil(n/8));
    g += rows.map((r,i)=> (i%step===0||i===n-1) ? `<text class="axis" x="${x(i)}" y="${H-8}" text-anchor="middle">N${esc(r.dayNo||i+1)}</text>` : "").join("");
    const labs = [];
    ser.forEach(s => {
      const pts = rows.map((r,i)=>[i,r[s.k]]).filter(p=>p[1]!=null && p[1]!=="");
      if (!pts.length) return;
      g += `<path class="ln" stroke="${s.c}" d="${pts.map((p,j)=>`${j?"L":"M"}${x(p[0]).toFixed(1)},${y(+p[1]).toFixed(1)}`).join("")}"/>`;
      g += pts.map(p=>`<circle class="dot" fill="${s.c}" cx="${x(p[0])}" cy="${y(+p[1])}" r="4"/>`).join("");
      const last = pts[pts.length-1]; labs.push({yy:y(+last[1]), xx:x(last[0]), t:`${s.name} ${Math.round(last[1])}%`});
    });
    labs.sort((a,b)=>a.yy-b.yy); for (let i=1;i<labs.length;i++) if (labs[i].yy-labs[i-1].yy<14) labs[i].yy = labs[i-1].yy+14;
    g += labs.map(l=>`<text class="dlab" x="${l.xx+8}" y="${l.yy+4}">${esc(l.t)}</text>`).join("");
    g += `<line class="xh" id="xh" x1="0" x2="0" y1="${T}" y2="${T+ih}" visibility="hidden"/><rect id="hit" x="${L}" y="${T}" width="${iw}" height="${ih}" fill="transparent"/>`;
    return {svg:`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Mức hiểu nghe và đọc theo ngày">${g}</svg>`, x, W, n};
  }
  // Giờ học có hướng dẫn tích luỹ từ con số 0 (Cambridge English, ước lượng). B1+/B2+ là nội suy.
  const LEVEL_HOURS = {"A2":[180,200],"B1":[350,400],"B1+":[425,500],"B2":[500,600],"B2+":[600,700],"C1":[700,800]};
  // Diễn giải ngắn từ khung tự đánh giá CEFR (Council of Europe) – điều Tân làm được khi đạt mức đó.
  const CAN_DO = {
    "B1+":"Nghe hiểu ý chính phần lớn podcast cho người học và hội thoại đời thường rõ ràng; đọc truyện graded và bài viết đời sống đơn giản mà ít phải đoán.",
    "B2":"Theo được phần lớn tin tức, phim và series nói giọng chuẩn; đọc báo, blog, bài phân tích về chủ đề quen thuộc; nói chuyện tự nhiên với người bản xứ về nhiều chủ đề mà hai bên không quá vất vả.",
    "B2+":"Xem phim/podcast bản xứ ít cần phụ đề; đọc sách thường (không graded) khá thoải mái; bắt đầu hiểu hàm ý, giọng điệu, đùa nhẹ.",
    "C1":"Hiểu lời nói dài, nhanh, không theo cấu trúc rõ ràng; xem phim gần như không cần phụ đề; đọc tài liệu dài, phức tạp; dùng tiếng Anh linh hoạt cho công việc, học tập, xã hội – đủ nền để chuyển sang tiếng Anh chuyên ngành IT."};
  const ORDER = ["A2","B1","B1+","B2","B2+","C1"];
  let paceChoice = null;
  function weekKey(d){ const t = new Date(d+"T12:00:00"); const day = (t.getDay()+6)%7; t.setDate(t.getDate()-day); return t.toISOString().slice(0,10); }
  function renderProgress(){
    const v = $("#view-progress"), P = profile || {}, coach = P.coach || {};
    const rows = stats.slice().sort((a,b)=>String(a.date).localeCompare(String(b.date)));
    const avg = k => { const a = rows.map(r=>r[k]).filter(x=>x!=null&&x!==""); return a.length ? a.reduce((s,x)=>s+ +x,0)/a.length : null; };
    const recent = k => { const a = rows.slice(-5).map(r=>r[k]).filter(x=>x!=null&&x!==""); return a.length ? a.reduce((s,x)=>s+ +x,0)/a.length : null; };
    const mins = r => (+r.minutesActual||0) + (+r.extraMinutes||0);
    const totalH = rows.reduce((s,r)=>s+mins(r),0)/60;
    // giờ theo tuần (bài + input thêm)
    const weeks = {}; rows.forEach(r => { const k = weekKey(r.date); weeks[k] = (weeks[k]||0) + mins(r)/60; });
    const wk = Object.keys(weeks).sort(), last4 = wk.slice(-4).map(k=>weeks[k]);
    const target = +coach.weekly_target_hours || 9;
    const measured = last4.length ? last4.reduce((a,b)=>a+b,0)/last4.length : null;
    const pace = paceChoice ?? (measured && measured > 0.5 ? Math.round(measured*2)/2 : target);
    const cur = String(P.cefr?.overall||"").trim(), ci = ORDER.indexOf(cur);
    const curEff = ci >= 0 ? cur : "B1";
    const curH = LEVEL_HOURS[curEff];
    const proj = ORDER.slice(ORDER.indexOf(curEff)+1).map(lv => {
      const [lo,hi] = LEVEL_HOURS[lv]; const need = [Math.max(0, lo-curH[1]), Math.max(0, hi-curH[0])];
      const m = h => Math.max(1, Math.round(h/pace/4.345));
      return {lv, need, months:[m(need[0]), m(need[1])]};
    });
    const wkBars = (() => {
      if (!wk.length) return `<p class="note">Chưa có tuần nào. Số giờ = thời gian làm bài + thời gian nghe/đọc thêm Tân ghi ở Feedback.</p>`;
      const show = wk.slice(-10), W = 720, H = 180, L = 36, R = 10, T = 12, B = 26, iw = W-L-R, ih = H-T-B;
      const mx = Math.max(target*1.2, ...show.map(k=>weeks[k]))||1, bw = Math.min(46, iw/show.length - 10);
      const y = h => T + ih - h/mx*ih;
      let g = [0, Math.round(mx/2), Math.round(mx)].map(h=>`<line class="grid" x1="${L}" x2="${W-R}" y1="${y(h)}" y2="${y(h)}"/><text class="axis" x="${L-6}" y="${y(h)+4}" text-anchor="end">${h}h</text>`).join("");
      g += `<line x1="${L}" x2="${W-R}" y1="${y(target)}" y2="${y(target)}" stroke="var(--ink-3)" stroke-dasharray="4 4"/><text class="axis" x="${W-R}" y="${y(target)-5}" text-anchor="end">mục tiêu ${target}h</text>`;
      show.forEach((k,i) => { const cx = L + (i+0.5)*iw/show.length, h = weeks[k], top = y(h);
        g += `<path d="M${cx-bw/2},${T+ih} V${top+4} q0,-4 4,-4 H${cx+bw/2-4} q4,0 4,4 V${T+ih} Z" fill="var(--s-read)"><title>Tuần từ ${k}: ${h.toFixed(1)} giờ</title></path>`;
        g += `<text class="axis" x="${cx}" y="${H-8}" text-anchor="middle">${k.slice(8,10)}/${k.slice(5,7)}</text>`;
        if (i === show.length-1) g += `<text class="dlab" x="${cx}" y="${top-6}" text-anchor="middle">${h.toFixed(1)}h</text>`; });
      return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Số giờ học mỗi tuần">${g}</svg></div>`;
    })();
    const weak = (P.weaknesses||[]).map(w => typeof w === "string" ? {area:"", detail:w} : w);
    const recs = coach.recommendations || [];
    const ch = rows.length ? chartSvg(rows) : null;
    const nextLv = proj[0]?.lv;
    v.innerHTML = `
      <section class="card sec">
        <span class="label">Bức tranh hiện tại</span>
        ${coach.summary_md ? `<div class="md">${md(coach.summary_md)}</div>` : `<p class="note">Gia sư sẽ viết tóm tắt sau khi chấm Ngày 1.</p>`}
        <div class="tiles">
          <div class="tile"><span class="label">Mức tổng thể</span><b>${esc(cur||"B1?")}</b><span class="sub">${cur?"gia sư ước lượng":"tự đánh giá, chờ Ngày 1"}</span></div>
          <div class="tile"><span class="label">Đã học</span><b>${rows.length} ngày</b><span class="sub">${totalH.toFixed(1)} giờ (bài + input thêm)</span></div>
          <div class="tile"><span class="label">Hiểu khi nghe · gần đây</span><b>${pct(recent("listenPct"))}</b><span class="sub">cả khoá ${pct(avg("listenPct"))}</span></div>
          <div class="tile"><span class="label">Hiểu khi đọc · gần đây</span><b>${pct(recent("readPct"))}</b><span class="sub">cả khoá ${pct(avg("readPct"))}</span></div>
        </div>
      </section>
      <section class="card sec">
        <span class="label">Gia sư khuyên để tiến nhanh hơn</span>
        ${recs.length ? `<div class="recs">${recs.map(r=>`<div class="rec-card"><b>${esc(r.title||"")}</b>${r.why?`<p class="note">Vì sao: ${inline(r.why)}</p>`:""}${r.how?`<p>${inline(r.how)}</p>`:""}</div>`).join("")}</div>` : `<p class="note">Chưa có.</p>`}
      </section>
        <section class="card sec">
          <span class="label">Thời gian học mỗi tuần</span>
          ${wkBars}
          <p class="note">Mục tiêu hiện tại: <b>${target} giờ/tuần</b>${coach.target_why?` – ${inline(coach.target_why)}`:""}. Trung bình 4 tuần gần nhất: <b>${measured!=null?measured.toFixed(1)+" giờ":"–"}</b>.</p>
        </section>
        <section class="card sec">
          <span class="label">Đang yếu gì & kế hoạch</span>
          ${weak.length ? `<div class="weak">${weak.map(w=>`<div class="weak-item">${w.area?`<span class="pill">${esc(w.area)}</span>`:""}<div><b>${inline(w.detail||"")}</b>${w.evidence?`<p class="note">Dấu hiệu: ${inline(w.evidence)}</p>`:""}${w.plan?`<p>→ ${inline(w.plan)}</p>`:""}</div></div>`).join("")}</div>` : `<p class="note">Chưa có.</p>`}
        </section>
      <section class="card sec">
        <span class="label">Dự báo tới C1</span>
        <div class="pace">Nếu Tân học
          <select id="pace-sel" class="pl-sel">${[3,5,7,9,12,15].concat([pace]).filter((x,i,a)=>a.indexOf(x)===i).sort((a,b)=>a-b).map(h=>`<option value="${h}" ${h==pace?"selected":""}>${h} giờ/tuần</option>`).join("")}</select>
          ${paceChoice==null ? `<span class="note">(${measured!=null?"theo nhịp đo được 4 tuần gần nhất":"theo mục tiêu, chưa đủ dữ liệu đo"})</span>` : ""}
        </div>
        <div class="tblwrap"><table class="days"><thead><tr><th>Mức</th><th>Còn khoảng</th><th>Ước tính</th><th>Khi đạt, Tân làm được</th></tr></thead><tbody>
          ${proj.map(p=>`<tr class="${p.lv===nextLv?"next":""}"><td class="num"><b>${esc(p.lv)}</b></td><td class="num">${p.need[0]}–${p.need[1]} giờ</td><td class="num">~${p.months[0]===p.months[1]?p.months[0]:p.months[0]+"–"+p.months[1]} tháng</td><td>${esc(CAN_DO[p.lv]||"")}</td></tr>`).join("")}
        </tbody></table></div>
        <p class="note">Cách tính: số giờ học có hướng dẫn mà Cambridge English ước lượng cho mỗi cấp CEFR (B1 ~350–400 → B2 ~500–600 → C1 ~700–800 giờ tính từ đầu; B1+/B2+ là nội suy), chia cho số giờ/tuần. Đây là <b>ước lượng thô</b>: tiến độ thật phụ thuộc chất lượng và lượng input. Nghe/đọc thêm ngoài bài thường rút ngắn đáng kể. Gia sư hiệu chỉnh lại mức hiện tại khoảng mỗi 3–4 tuần.</p>
      </section>
      <section class="card sec">
        <span class="label">Mức hiểu theo ngày (gia sư đánh giá)</span>
        ${ch ? `<div class="legend"><span><i style="background:var(--s-read)"></i>Đọc</span><span><i style="background:var(--s-listen)"></i>Nghe</span></div>
          <div class="chart" id="chart">${ch.svg}<div class="tip" id="tip" hidden></div></div>
          <p class="note">Mục tiêu theo Comprehensible Input: bài đọc/nghe rộng hiểu khoảng 90–98%. Thấp hơn thì gia sư hạ mức, cao và dễ quá thì nâng mức.</p>`
          : `<p class="note">Biểu đồ sẽ hiện khi có bài đầu tiên được chấm.</p>`}
      </section>
      <section class="card sec">
        <span class="label">Đánh giá từng ngày</span>
        ${rows.length ? `<div class="tblwrap"><table class="days"><thead><tr><th>Ngày</th><th>Bài</th><th>Nghe</th><th>Đọc</th><th>Độ khó</th><th>Phút (bài + thêm)</th><th>Giáo viên nhận xét</th></tr></thead><tbody>
          ${rows.slice().reverse().map(r=>`<tr data-id="${esc(r.lessonId)}"><td class="num">N${esc(r.dayNo||"")} · ${esc(fmtDate(r.date))}</td><td>${esc(r.title||"")}</td><td class="num">${pct(r.listenPct)}</td><td class="num">${pct(r.readPct)}</td><td class="num">${r.difficulty?esc(r.difficulty)+"/5":"–"}</td><td class="num">${esc(r.minutesActual||"–")}${r.extraMinutes?" + "+esc(r.extraMinutes):""}</td><td>${inline(r.note||"")}</td></tr>`).join("")}
          </tbody></table></div>` : `<p class="note">Chưa có ngày nào được chấm.</p>`}
      </section>`;
    v.querySelectorAll("tr[data-id]").forEach(tr => tr.addEventListener("click", () => { location.hash = tr.dataset.id; }));
    $("#pace-sel").addEventListener("change", e => { paceChoice = Number(e.target.value); renderProgress(); });
    if (ch){
      const box = $("#chart"), svg = box.querySelector("svg"), tip = $("#tip"), xh = svg.querySelector("#xh");
      const move = ev => {
        const r = svg.getBoundingClientRect(), sx = (ev.clientX - r.left) * ch.W / r.width;
        let bi = 0, bd = 1e9; rows.forEach((_,i)=>{ const d = Math.abs(ch.x(i)-sx); if (d<bd){bd=d;bi=i;} });
        const row = rows[bi], px = ch.x(bi);
        xh.setAttribute("x1",px); xh.setAttribute("x2",px); xh.setAttribute("visibility","visible");
        tip.hidden = false; tip.style.left = (px/ch.W*r.width)+"px"; tip.style.top = "40px";
        tip.innerHTML = `<b>Ngày ${esc(row.dayNo||bi+1)} · ${esc(fmtDate(row.date))}</b><div><span class="sw" style="background:var(--s-read)"></span>Đọc ${pct(row.readPct)}</div><div><span class="sw" style="background:var(--s-listen)"></span>Nghe ${pct(row.listenPct)}</div>`;
      };
      const hide = () => { tip.hidden = true; xh.setAttribute("visibility","hidden"); };
      svg.querySelector("#hit").addEventListener("pointermove", move);
      svg.querySelector("#hit").addEventListener("pointerleave", hide);
    }
  }
  function showView(name){
    $("#view-lessons").hidden = name!=="lessons"; $("#view-profile").hidden = name!=="profile"; $("#view-progress").hidden = name!=="progress";
    document.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-current", t.dataset.view===name ? "page" : "false"));
    if (name==="profile") renderProfile();
    if (name==="progress") renderProgress();
  }

  function route(){
    const h = decodeURIComponent(location.hash.slice(1));
    if (h === "ho-so"){ showView("profile"); return; }
    if (h === "tien-do"){ showView("progress"); return; }
    showView("lessons");
    current = lessons.some(l => l.id === h) ? h : (lessons[0]?.id || null);
    delete $("#main").dataset.editing;
    watchCurrent();
    renderList(); renderLesson();
  }
  window.addEventListener("hashchange", route);

  async function boot(){
    // 1) Dữ liệu từ repo (xuất bản kèm trang) – hiển thị được ngay cả khi chưa có database
    try {
      const [days, prof] = await Promise.all([getJSON("data/days.json"), getJSON("data/profile.json").catch(() => null)]);
      lessons = (days.days || []).slice().sort((a,b) => String(b.id).localeCompare(String(a.id)));
      stats = lessons.filter(d => d.status === "graded").map(d => ({lessonId:d.id, ...d}));
      profile = prof && Object.keys(prof).length ? prof : null;
      $("#s-done").textContent = stats.length;
      if (profile?.week != null){ week = Number(profile.week)||1; $("#s-week").textContent = week; }
      if (profile?.streak != null) $("#s-streak").textContent = profile.streak;
      renderTrack();
    } catch(e){ $("#list").innerHTML = `<p class="note">Không tải được danh sách bài (${esc(e?.code||"lỗi")}). Tải lại trang thử nhé.</p>`; }
    route();
    // 2) Database chỉ để nộp bài
    db = window.claude?.use ? await claude.use("db").catch(() => null) : null;
    if (db) watchCurrent();
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot); else boot();
})();
</script>
