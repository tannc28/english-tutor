    }));
    $("#wc-done")?.addEventListener("click", () => { wc = null; renderVocab(L); });
    $("#vb-open")?.addEventListener("click", () => { browse = {level:L.id, q:"", n:120}; wc = null; renderVocab(L); });
    $("#vb-close")?.addEventListener("click", () => { browse = null; renderVocab(L); });
    $("#vb-more")?.addEventListener("click", () => { browse.n += 240; renderVocab(L); });
    const qi = $("#vb-q"); if (qi){ qi.addEventListener("input", () => { browse.q = qi.value; const pos = qi.selectionStart; renderVocab(L).then(() => { const n = $("#vb-q"); n?.focus(); try { n.setSelectionRange(pos,pos); } catch {} }); }); }
    box.querySelectorAll(".vb-w").forEach(b => b.addEventListener("click", () => { const w = b.dataset.w; if (SC.words[w]) delete SC.words[w]; else SC.words[w] = 1; saveSC(); b.classList.toggle("on"); b.firstChild.textContent = (SC.words[w]?"✓ ":"") + w + " "; }));
  }

  // ---- 🧠 Review: tra cứu mọi thứ đã học (data/library.json – sync.py tự gom) + thẻ lật ôn tập (SRS lưu trong drafts/selfcheck)
  let LIB = null, rvTab = "words", rvQ = "", fc = null, rvAudio = null;
  const SRS_DAYS = [1, 3, 7, 14, 30];
  const addDays = n => { const d = new Date(); d.setDate(d.getDate()+n); return ymd(d); };
  const srsOf = w => (SC.srs ||= {})[w.w] || null;
  const isDue = w => { const r = srsOf(w); return !r || r.due <= todayStr(); };
  async function renderReview(){
    const v = $("#view-review");
    try { await loadLevels(); LIB ||= await getJSON("data/library.json"); } catch(e){ v.innerHTML = `<section class="card sec"><p class="note">Couldn't load your library (${esc(e?.code||"error")}).</p></section>`; return; }
    const words = LIB.words, due = words.filter(isDue), known = words.filter(w => srsOf(w)?.step >= 3);

    if (fc) body = flashcardHtml();

      body = `<div class="rv-words">${list.map(w => { const r = srsOf(w), st = !r ? "new" : r.step >= 3 ? "known" : r.due <= todayStr() ? "due" : "learning";
        return `<button type="button" class="rv-w" data-w="${esc(w.w)}">${w.img?`<img src="${esc(w.img)}" alt="" loading="lazy">`:`<span class="rv-noimg">${w.kind==="chunk"?"🧩":"📝"}</span>`}
          <span class="rv-wt"><b>${esc(w.w)}</b>${w.ipa?`<span class="ipa">${esc(w.ipa)}${w.ipa_us && w.ipa_us!==w.ipa?` · US ${esc(w.ipa_us)}`:""}</span>`:""}<span class="pill rv-${st}">${{new:"new",due:"review today",learning:"learning",known:"known ✓"}[st]}</span></span>
          <span class="rv-wd">${w.def?inline(w.def):""}${w.ex?`<i>“${esc(w.ex)}”</i>`:""}${w.vi?`<span class="note">🇻🇳 ${esc(w.vi)}</span>`:""}${w.week?`<span class="note">Week ${esc(w.week)}</span>`:""}</span></button>`; }).join("") || `<p class="note">Nothing matches “${esc(rvQ)}”.</p>`}</div>`;
    } else if (rvTab === "learn"){
      body = `<div class="rv-list">${LIB.learn.filter(x => hit(x.title)).map(x => `<a class="rv-row" href="#${esc(x.lesson)}/p${esc(x.part)}">${x.img?`<img src="${esc(x.img)}" alt="">`:`<span class="rv-noimg">🧩</span>`}<span><b>${esc(x.title)}</b><span class="note">Week ${esc(x.week)} · Lesson ${esc(x.order)}${x.date?` · ${esc(fmtDate(x.date))}`:""} · ${x.status==="graded"?"✅ done":"not done yet"}</span></span><span class="td-go">Open ▶</span></a>`).join("")}</div>
        <p class="note">Each one opens the ① Learn part of the lesson – tables, examples and audio.</p>`;
    } else if (rvTab === "mistakes"){
      body = LIB.mistakes.length ? `<div class="rv-mis">${LIB.mistakes.filter(m => hit(m.q)||hit(m.right)||hit(m.tip)).map(m => `<div class="rv-m"><span class="note">${esc(fmtDate(m.date))} · <a href="#${esc(m.lesson)}">lesson</a></span><b>${esc(m.q)}</b>
          <span class="rv-no">❌ ${esc(m.yours)}</span><span class="rv-ok">✅ ${esc(m.right)}</span><span class="rv-tip">💡 ${esc(m.tip)}</span></div>`).join("")}</div>` : `<p class="note">No mistakes saved yet.</p>`;
    } else if (rvTab === "story"){
      body = `<p class="note">${esc(profile?.story?.title||"Hope Street")} – read the episodes again in order. Re-reading a story you know is one of the best ways to read faster.</p>
        <div class="rv-list">${LIB.story.map((x,i) => `<a class="rv-row" href="#${esc(x.lesson)}/p${esc(x.part)}"><span class="rv-noimg">${i+1}</span><span><b>${esc(x.title)}</b><span class="note">Week ${esc(x.week)} · ${x.date?esc(fmtDate(x.date)):""}</span></span><span class="td-go">Read ▶</span></a>`).join("")}</div>`;
    } else {
      const cur = LV.levels.find((l,i) => lvStats(l).pct < 80) || LV.levels[0];
      const todo = cur.sections.flatMap(sec => sec.items.filter(i => !i.later && (MA.items[i.id]?.tutor||"unknown") !== "got_it")).slice(0, 10);
      const upcoming = weeks.filter(w => w.status === "planned");
      const unk = Object.entries(SC.vocab||{}).flatMap(([k,r]) => (r.unknown||[]).map(w => w)).slice(0, 30);
      body = `<div class="rv-next">

        <div><span class="label">Still to learn at ${esc(cur.id)} (${todo.length} shown)</span>${todo.map(i => `<a class="rv-row" href="#level"><span class="rv-noimg">${ST[MA.items[i.id]?.tutor||"unknown"][0]}</span><span>${inline(i.text)}</span></a>`).join("")}</div>
        <div><span class="label">Words you didn't know in your word check</span><p>${unk.length ? unk.map(esc).join(" · ") : `<span class="note">Do a word check in 🎯 Levels – the words you don't know will appear here.</span>`}</p></div></div>`;
    }
    v.innerHTML = `
      <section class="card sec rv-top">
        <div class="rv-hero"><div><span class="label">Review – everything you've learned</span><h2>${(() => { const rv = due.filter(w => srsOf(w)).length, nw = due.length - rv; return due.length ? [rv?`${rv} to review`:"", nw?`${Math.min(nw,10)} new card${Math.min(nw,10)>1?"s":""} today`:""].filter(Boolean).join(" · ") : "All caught up 🎉"; })()}</h2>
          <p class="note">${words.length} words & chunks · ${known.length} known · cards come back after 1 → 3 → 7 → 14 → 30 days, so you don't forget.</p></div>

    v.querySelectorAll(".rv-tabs [data-t]").forEach(b => b.addEventListener("click", () => { rvTab = b.dataset.t; renderReview(); }));

      else { SC.srs[w.w] = {step:0, due:todayStr(), at:todayStr()}; fc.cards.push(w); }
      saveSC(); fc.i++; fc.flip = false; renderReview(); }));
    $("#fc-end")?.addEventListener("click", () => { fc = null; renderReview(); });

  function playWord(src){ try { rvAudio?.pause(); rvAudio = new Audio(src); rvAudio.play().catch(()=>{}); } catch {} }
  function flashcardHtml(){
    if (fc.i >= fc.cards.length) return `<div class="fc-done"><div class="wc-big">🎉</div><b>Done! ${fc.ok} card${fc.ok===1?"":"s"} remembered.</b><p class="note">They'll come back later, just before you forget them.</p><button type="button" class="primary" id="fc-end">Back to Review</button></div>`;

        ${fc.flip ? `<span class="fc-back">${w.def?`<span>${inline(w.def)}</span>`:""}${w.ex?`<i>“${esc(w.ex)}”</i>`:""}${w.vi?`<span class="note">🇻🇳 ${esc(w.vi)}</span>`:""}</span>` : `<span class="note">What does it mean? Think, then tap.</span>`}
      </button>

  // 3 nhóm chính, mỗi nhóm có tab con (Tân 12/11: ít tab, gộp cái chung)
  const GROUPS = {
    learn: [["week","🗓 This week","#"],["lessons","📚 Lessons","#bai"],["listen","🎧 Listening","#nghe"]],
    review: [["review","🧠 Review & practise","#on-tap"]],
    progress: [["levels","🎯 Levels","#level"],["progress","📊 Stats","#tien-do"],["profile","👤 Profile","#ho-so"]]};
  const groupOf = v => Object.keys(GROUPS).find(g => GROUPS[g].some(x => x[0] === v)) || "learn";
  function showView(name){
    const g = groupOf(name);
    document.querySelectorAll(".main3 .tab").forEach(t => t.setAttribute("aria-current", t.dataset.group === g ? "page" : "false"));
    const sub = $("#subtabs"); sub.hidden = GROUPS[g].length < 2;
    sub.innerHTML = GROUPS[g].map(([v,t,h]) => `<a href="${h}" class="stab" aria-current="${v===name?"page":"false"}">${t}</a>`).join("");

    $("#view-review").hidden = name!=="review";
    if (name==="review") renderReview();
    $("#view-levels").hidden = name!=="levels";
    if (name==="levels") renderLevels();
    $("#view-week").hidden = name!=="week";
    if (name==="week") renderWeek();
    $("#view-listen").hidden = name!=="listen";
    if (name==="listen") renderListen();
    $("#view-lessons").hidden = name!=="lessons"; $("#view-profile").hidden = name!=="profile"; $("#view-progress").hidden = name!=="progress";
    if (name==="profile") renderProfile();
    if (name==="progress") renderProgress();
  }

  function route(){
    const h = decodeURIComponent(location.hash.slice(1));
    if (h === "ho-so"){ showView("profile"); return; }
    if (h === "tien-do"){ showView("progress"); return; }
    if (h === "nghe"){ showView("listen"); return; }
    if (!h || h === "ke-hoach" || h === "tuan"){ showView("week"); return; }
    if (h === "level"){ showView("levels"); return; }
    if (h === "on-tap"){ showView("review"); return; }
    showView("lessons");
    const nextOpen = lessons.filter(l => l.week === curWeek()?.no).sort((a,b)=>(a.order||0)-(b.order||0)).find(l => statusOf(l)==="open");
    const [hid, hp] = h.split("/");
    current = lessons.some(l => l.id === hid) ? hid : (nextOpen?.id || lessons[0]?.id || null);
    if (hp && /^p\d+$/.test(hp)) setTimeout(() => document.getElementById("part-"+hp.slice(1))?.scrollIntoView({behavior:"smooth", block:"start"}), 700);
    delete $("#main").dataset.editing;
    watchCurrent();
    renderList(); renderLesson();
  }
  window.addEventListener("hashchange", route);

  async function boot(){
    // 1) Dữ liệu từ repo (xuất bản kèm trang) – hiển thị được ngay cả khi chưa có database
    try {
      const [idx, wk, prof] = await Promise.all([getJSON("data/lessons.json"), getJSON("data/weeks.json").catch(() => ({weeks:[]})), getJSON("data/profile.json").catch(() => null)]);
      weeks = wk.weeks || []; buildPlanOf();
      buildPlanOf();
      lessons = (idx.lessons || []).slice().sort((a,b) => ((b.week||0)-(a.week||0)) || String(planOf[a.id]?.ds||"9").localeCompare(String(planOf[b.id]?.ds||"9")) || ((a.order||0)-(b.order||0)));
      stats = lessons.filter(d => d.status === "graded").map(d => ({lessonId:d.id, ...d}));
      profile = prof && Object.keys(prof).length ? prof : null;
      $("#s-done").textContent = stats.length;
      week = curWeek()?.no || Number(profile?.week) || 1; $("#s-week").textContent = week;
      if (profile?.streak != null){ $("#s-streak").textContent = profile.streak; $("#s-streak-u").textContent = Number(profile.streak) === 1 ? "day" : "days"; }
      renderTrack();
    } catch(e){ $("#list").innerHTML = `<p class="note">Couldn't load the lesson list (${esc(e?.code||"error")}). Please reload.</p>`; }
    route();
    // 2) Database chỉ để nộp bài
    db = window.claude?.use ? await claude.use("db").catch(() => null) : null;
    if (db) watchCurrent();
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot); else boot();
})();
</script>
