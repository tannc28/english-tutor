<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 288" width="384" height="288">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFF4E6"/><stop offset="1" stop-color="#E8F5EC"/></linearGradient>
<linearGradient id="grass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9FD3A9"/><stop offset="1" stop-color="#7FBE8E"/></linearGradient>
</defs>
<rect width="384" height="288" fill="url(#bg)"/>
<circle cx="60" cy="54" r="22" fill="#FFE08A"/>
<rect x="0" y="206" width="384" height="82" fill="url(#grass)"/>
<!-- path -->
<path d="M0 262 Q190 230 384 262 L384 288 L0 288Z" fill="#E9DCC4"/>
<!-- trees -->
<rect x="300" y="130" width="10" height="80" fill="#8C6239"/>
<circle cx="305" cy="118" r="34" fill="#6DBE8A"/>
<circle cx="326" cy="132" r="22" fill="#5AAE78"/>
<!-- motion lines -->
<g stroke="#B9C7D6" stroke-width="3" stroke-linecap="round">
<line x1="40" y1="200" x2="90" y2="200"/><line x1="24" y1="216" x2="80" y2="216"/><line x1="54" y1="184" x2="96" y2="184"/>
</g>
<!-- running young woman with backpack -->
<g transform="translate(150,246) scale(0.9)">
<ellipse cx="6" cy="2" rx="24" ry="4" fill="#2B3A4A" opacity="0.15"/>
<!-- back leg -->
<path d="M-4 -66 L-22 -28" stroke="#3E4A59" stroke-width="10" stroke-linecap="round"/>
<ellipse cx="-24" cy="-26" rx="8" ry="4" fill="#2B2B2B"/>
<!-- front leg -->
<path d="M4 -66 L24 -30 L30 -34" stroke="#3E4A59" stroke-width="10" stroke-linecap="round" fill="none"/>
<ellipse cx="34" cy="-36" rx="8" ry="4" fill="#2B2B2B"/>
<!-- torso leaning forward -->
<path d="M-12 -124 L16 -124 Q22 -100 12 -68 L-6 -68 Q-12 -96 -12 -124Z" fill="#FFFFFF"/>
<path d="M-12 -124 L16 -124 L14 -106 L-10 -106Z" fill="#E0857A" opacity="0.0"/>
<!-- backpack -->
<rect x="-30" y="-120" width="22" height="34" rx="6" fill="#E0857A"/>
<rect x="-26" y="-112" width="14" height="6" rx="2" fill="#C86A60"/>
<!-- arms swinging -->
<path d="M10 -116 L30 -96 L40 -104" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round" fill="none"/>
<path d="M-6 -116 L-22 -92" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round" fill="none"/>
<circle cx="42" cy="-106" r="5" fill="#F1C7A5"/>
<circle cx="-24" cy="-90" r="5" fill="#F1C7A5"/>
<!-- head with ponytail -->
<circle cx="8" cy="-150" r="17" fill="#F1C7A5"/>
<path d="M-9 -152 Q-8 -170 8 -170 Q24 -168 24 -150 Q18 -162 6 -160 Q-6 -158 -9 -152Z" fill="#C0462E"/>
<path d="M22 -158 Q40 -156 36 -140 Q30 -146 22 -146Z" fill="#C0462E"/>
<circle cx="14" cy="-150" r="1.8" fill="#2B2B2B"/>
<path d="M12 -140 Q16 -136 20 -140" fill="none" stroke="#8A5A44" stroke-width="1.6" stroke-linecap="round"/>
</g>
<!-- speed sparkles -->
<g fill="#F2C86B"><circle cx="220" cy="120" r="4"/><circle cx="234" cy="108" r="3"/><circle cx="210" cy="104" r="2.5"/></g>
</svg>
