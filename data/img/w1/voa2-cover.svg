<g fill="#CFD8DC"><rect x="60" y="146" width="8" height="6"/><rect x="74" y="146" width="8" height="6"/><rect x="88" y="146" width="8" height="6"/><rect x="60" y="158" width="8" height="6"/><rect x="74" y="158" width="8" height="6"/></g>
<circle cx="92" cy="161" r="8" fill="none" stroke="#E53935" stroke-width="3"/></g>
