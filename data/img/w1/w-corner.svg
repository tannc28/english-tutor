<rect x="20" y="244" width="6" height="36"/><rect x="36" y="244" width="6" height="36"/><rect x="52" y="244" width="6" height="36"/><rect x="68" y="244" width="6" height="36"/><rect x="84" y="244" width="6" height="36"/>
