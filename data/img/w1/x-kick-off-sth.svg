<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 288" width="384" height="288">
<rect width="384" height="288" fill="#EEF3F8"/>
<!-- stadium stands -->
<rect x="0" y="30" width="384" height="60" fill="#C9D6E3"/>
<rect x="0" y="90" width="384" height="34" fill="#B5C6D6"/>
<g fill="#E74C3C" opacity=".7"><circle cx="20" cy="50" r="4"/><circle cx="60" cy="44" r="4"/><circle cx="110" cy="52" r="4"/><circle cx="170" cy="46" r="4"/><circle cx="230" cy="54" r="4"/><circle cx="300" cy="44" r="4"/><circle cx="350" cy="52" r="4"/></g>
<g fill="#F4C542" opacity=".8"><circle cx="40" cy="70" r="4"/><circle cx="92" cy="74" r="4"/><circle cx="144" cy="68" r="4"/><circle cx="260" cy="72" r="4"/><circle cx="330" cy="68" r="4"/></g>
<g fill="#2E8B57" opacity=".7"><circle cx="8" cy="104" r="4"/><circle cx="78" cy="108" r="4"/><circle cx="200" cy="104" r="4"/><circle cx="290" cy="110" r="4"/><circle cx="370" cy="104" r="4"/></g>
<!-- pitch -->
<rect x="0" y="124" width="384" height="164" fill="#7BC47F"/>
<rect x="0" y="124" width="384" height="16" fill="#86CC89"/>
<ellipse cx="192" cy="200" rx="60" ry="22" fill="none" stroke="#FFFFFF" stroke-width="3"/>
<line x1="192" y1="124" x2="192" y2="288" stroke="#FFFFFF" stroke-width="3" opacity="0"/>
<rect x="0" y="124" width="384" height="3" fill="#FFFFFF" opacity=".9"/>
<!-- player (kit red, white shorts) -->
<ellipse cx="180" cy="262" rx="26" ry="5" fill="#000" opacity=".12"/>
<rect x="172" y="200" width="9" height="52" rx="4" fill="#FFFFFF"/>
<rect x="172" y="244" width="11" height="8" rx="3" fill="#2E3B55"/>
<rect x="162" y="168" width="32" height="40" rx="6" fill="#FFFFFF"/>
<rect x="162" y="144" width="32" height="30" rx="8" fill="#E74C3C"/>
<line x1="164" y1="150" x2="142" y2="176" stroke="#E74C3C" stroke-width="8" stroke-linecap="round"/>
<line x1="192" y1="150" x2="216" y2="134" stroke="#E74C3C" stroke-width="8" stroke-linecap="round"/>
<circle cx="140" cy="178" r="5" fill="#F1C7A5"/>
<circle cx="218" cy="132" r="5" fill="#F1C7A5"/>
<!-- kicking leg -->
<line x1="186" y1="204" x2="232" y2="236" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round"/>
<line x1="232" y1="236" x2="242" y2="240" stroke="#2E3B55" stroke-width="8" stroke-linecap="round"/>
<circle cx="180" cy="134" r="15" fill="#F1C7A5"/>
<path d="M165 136 Q164 120 180 120 Q196 120 195 136 Q190 128 180 128 Q170 128 165 136Z" fill="#1E1E1E"/>
<!-- ball -->
<ellipse cx="266" cy="250" rx="12" ry="3" fill="#000" opacity=".15"/>
<circle cx="260" cy="236" r="11" fill="#FFFFFF" stroke="#333" stroke-width="1.5"/>
<path d="M256 232 L260 228 L264 232 L262 237 L257 237Z" fill="#333"/>
<!-- motion lines -->
<g stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity=".9">
<line x1="282" y1="226" x2="300" y2="222"/><line x1="284" y1="236" x2="304" y2="236"/><line x1="280" y1="246" x2="296" y2="250"/>
</g>
</svg>
